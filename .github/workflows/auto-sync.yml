name: Auto Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

jobs:
  sync-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dosya yazma iznini burada da zorunlu kılıyoruz
    steps:
      - name: Repoyu Kontrol Et
        uses: actions/checkout@v4

      - name: Python'u Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install requests

      - name: Section 11 Senkronizasyonunu Çalıştır
        env:
          ATHLETE_ID: ${{ secrets.ATHLETE_ID }}
          INTERVALS_KEY: ${{ secrets.INTERVALS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub bunu kendi sağlar, senin eklemene gerek yok
        run: |
          python sync.py
          # Dosyanın en başına güncel tarihi ekleyelim (Gemini'nin görmesi için)
          echo -e "Last Updated: $(date +'%Y-%m-%d %H:%M:%S')\n$(cat DOSSIER.md)" > DOSSIER.md

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik güncelleme: AI Koçluk verileri senkronize edildi" && git push)
