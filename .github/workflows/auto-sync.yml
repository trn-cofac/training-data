name: Auto Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

jobs:
  sync-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dosya yazma iznini burada da zorunlu kılıyoruz
    steps:
      - name: Repoyu Kontrol Et
        uses: actions/checkout@v4

      - name: Python'u Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install requests

    - name: Section 11 Senkronizasyonunu Çalıştır
        env:
          ATHLETE_ID: ${{ secrets.ATHLETE_ID }}
          INTERVALS_KEY: ${{ secrets.INTERVALS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # 1. Verileri senkronize et
          python sync.py --output latest.json
          
          # 2. DOSSIER.md güncelleme (Eski tarihi siler, yenisini ekler)
          # Bu komut dosyanın şişmesini engeller, sadece en üstteki satırı günceller
          sed -i '/^Last Updated:/d' DOSSIER.md
          echo -e "Last Updated: $(date +'%Y-%m-%d %H:%M:%S')\n$(cat DOSSIER.md)" > DOSSIER.md

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          # Eğer değişiklik yoksa hata vermeden geçmesi için kontrol
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik güncelleme: AI Koçluk verileri senkronize edildi" && git push)
