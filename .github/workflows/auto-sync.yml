name: Section 11 Auto Sync

on:
  schedule:
    # Her 15 dakikada bir çalışır
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Manuel tetikleme için buton ekler

jobs:
  sync-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kontrol Et
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests  # sync.py için gerekliyse

      - name: Verileri Senkronize Et ve Dossier Güncelle
        env:
          ATHLETE_ID: ${{ secrets.ATHLETE_ID }}
          INTERVALS_KEY: ${{ secrets.INTERVALS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # 1. Intervals.icu verilerini çek ve latest.json oluştur
          python sync.py --output latest.json
          
          # 2. DOSSIER.md dosyasındaki eski 'Last Updated' satırını sil
          sed -i '/^Last Updated:/d' DOSSIER.md
          
          # 3. En başa güncel tarihi ekle
          echo -e "Last Updated: $(date +'%Y-%m-%d %H:%M:%S')\n$(cat DOSSIER.md)" > DOSSIER.md

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          # Eğer dosyalarda gerçek bir değişiklik yoksa hata vermemesi için kontrol
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik güncelleme: AI Koçluk verileri senkronize edildi" && git push)
