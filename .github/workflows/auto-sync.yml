name: Auto Sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

jobs:
  sync-job:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kontrol Et
        uses: actions/checkout@v4

      - name: Python'u Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        # Eğer orijinal kodun için özel kütüphaneler (örn: pandas) gerekiyorsa, buraya ekleyebilirsin.
        run: pip install requests

     - name: Section 11 Senkronizasyonunu Çalıştır
        env:
          # Intervals Kimlikleri (Scriptin bekleyebileceği tüm ihtimalleri kapsıyoruz)
          INTERVALS_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          
          # GitHub Kimlikleri (GitHub bunları otomatik sağlar)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync.py

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik güncelleme: AI Koçluk verileri güncellendi" && git push)
